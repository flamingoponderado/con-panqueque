name = "con-panqueque"
version = "0.1.0"
defaultTargets = ["ConPanqueque", "ConPanquequeCode"]

[[require]]
name = "con-leche"
path = "deps/con-leche"

[[require]]
name = "Flapjack"
path = "deps/flapjack"

[[lean_lib]]
name = "ConPanqueque"

# The concrete code table and the proofs that it meets every code assumption (slow: ~30 min).
[[lean_lib]]
name = "ConPanquequeCode"
roots = ["ConPanqueque.Code.Top", "ConPanqueque.Code.Layout", "ConPanqueque.Start.Boot", "ConPanqueque.Start.Stores", "ConPanqueque.Start.Empty", "ConPanqueque.Start.InitSR", "ConPanqueque.Start.InitCtx", "ConPanqueque.Start.PinName", "ConPanqueque.Start.PinList", "ConPanqueque.Start.PinCtx", "ConPanqueque.Start.PinPhase", "ConPanqueque.Start.Main", "ConPanqueque.Start.Model", "ConPanqueque.Pipeline.Ext"]

# con-ron's Lean twin of the checker and its Theorem 1 (the twin refines
# con-leche), built from the `deps/con-ron` submodule. They depend on con-leche
# only (no Aeneas, no Mathlib). The two options are the ones con-ron sets
# project-wide; its proofs are elaborated under them.
[[lean_lib]]
name = "ConRonArena"
srcDir = "deps/con-ron/proof"
roots = ["ConRon.Arena"]
leanOptions.weak.backward.isDefEq.respectTransparency = false
leanOptions.weak.backward.do.legacy = true

[[lean_lib]]
name = "ConRonBridge"
srcDir = "deps/con-ron/proof"
roots = ["ConRon.Bridge"]
globs = ["ConRon.Bridge.*"]
leanOptions.weak.backward.isDefEq.respectTransparency = false
leanOptions.weak.backward.do.legacy = true
